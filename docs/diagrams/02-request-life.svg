<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1008" width="960" height="1008" role="img" aria-labelledby="request-life-title request-life-desc">
<title id="request-life-title">Full: life of one request</title>
<desc id="request-life-desc">Your words are kept verbatim and worked out by the entry into tracker items; the job goes into that topic's conversation (the same one every time, continued even after Claude Code stopped its process); it checks the second brain first, closes the item with evidence and reports to the entry; the entry opens the real thing before it counts as done; you get the result itself; each correction or confirmation becomes one line for maintenance.</desc>
