<rect x="458.0" y="509.0" width="25.9" height="14" rx="2" fill="#f5f5f5"/><text x="470.9" y="518.8" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.5" fill="#5a6580">YES</text>
<rect x="680.0" y="397.0" width="68.3" height="14" rx="2" fill="#f5f5f5"/><text x="714.1" y="406.8" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.5" fill="#5a6580">NO EVIDENCE</text>
<rect x="300" y="36" width="300" height="56" rx="6" fill="#f5f5f5"/><rect x="300" y="36" width="300" height="56" rx="6" fill="#4f5d75" fill-opacity="0.1" stroke="#5a6580" stroke-opacity="1" stroke-width="1"/><text x="450.0" y="60.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">You say one sentence</text><text x="450.0" y="76.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">你說一句話</text>
<rect x="300" y="128" width="300" height="56" rx="6" fill="#f5f5f5"/><rect x="300" y="128" width="300" height="56" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1"/><text x="450.0" y="145.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Entry adds a ledger row</text><text x="450.0" y="161.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">入口先登記一行帳</text><text x="450.0" y="175.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">ledger.py add  →  L0007 · open</text>
<rect x="300" y="220" width="300" height="56" rx="6" fill="#f5f5f5"/><rect x="300" y="220" width="300" height="56" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1"/><text x="450.0" y="237.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Entry hands it to a topic</text><text x="450.0" y="253.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">查 routes.md，交給主題對話</text><text x="450.0" y="267.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">send.py  →  inbox · dispatched:study</text>
<rect x="300" y="324" width="300" height="56" rx="6" fill="#f5f5f5"/><rect x="300" y="324" width="300" height="56" rx="6" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1"/><text x="450.0" y="341.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Topic session works</text><text x="450.0" y="357.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">主題對話開工</text><text x="450.0" y="371.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">inbox  →  task.md  →  do it</text>
<polygon points="450.0,412 600,456.0 450.0,500 300,456.0" fill="#f5f5f5"/><polygon points="450.0,412 600,456.0 450.0,500 300,456.0" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1" stroke-linejoin="round"/><text x="450.0" y="452.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Real result looked at?</text><text x="450.0" y="468.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">有看過實際結果嗎？</text>
<rect x="300" y="532" width="300" height="56" rx="6" fill="#f5f5f5"/><rect x="300" y="532" width="300" height="56" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-opacity="1" stroke-width="1.5"/><text x="450.0" y="549.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Close the row with evidence</text><text x="450.0" y="565.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">附證據關帳</text><text x="450.0" y="579.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">ledger.py done L0007 --evidence</text>
<rect x="300" y="620" width="300" height="56" rx="6" fill="#f5f5f5"/><rect x="300" y="620" width="300" height="56" rx="6" fill="#4f5d75" fill-opacity="0.1" stroke="#5a6580" stroke-opacity="1" stroke-width="1"/><text x="450.0" y="637.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">You see it closed</text><text x="450.0" y="653.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">你看到它關掉了</text><text x="450.0" y="667.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">/sbk-status  ·  or ask the entry</text>
<text x="692" y="468" text-anchor="start" font-family="'Instrument Serif','Noto Serif TC','Georgia',serif" font-size="14" font-weight="400" fill="#4f5d75" font-style="italic">A bare “done” is refused by the ledger;</text>
<text x="692" y="486" text-anchor="start" font-family="'Instrument Serif','Noto Serif TC','Georgia',serif" font-size="14" font-weight="400" fill="#4f5d75" font-style="italic">the Stop hook asks once more.</text>
<text x="692" y="504" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6580">沒附證據的「做完」帳本不收，</text>
<text x="692" y="522" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6580">Stop hook 會再問一次。</text>
<line x1="36" y1="722" x2="924" y2="722" stroke="#bfc0c0" stroke-width="1"/><rect x="40" y="736" width="20" height="12" rx="3" fill="#4f5d75" fill-opacity="0.1" stroke="#5a6580" stroke-opacity="1" stroke-width="1"/><text x="68" y="745" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">YOU</text><rect x="106.2" y="736" width="20" height="12" rx="3" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-opacity="1" stroke-width="1"/><text x="134.2" y="745" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">STEP</text><rect x="177.79999999999998" y="736" width="20" height="12" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-opacity="1" stroke-width="1.5"/><text x="205.79999999999998" y="745" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">CLOSES THE ROW</text><line x1="303.4" y1="742" x2="329.4" y2="742" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#request-life-arrow)"/><text x="337.4" y="745" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">FLOW</text><line x1="381.0" y1="742" x2="407.0" y2="742" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#request-life-arrow)"/><text x="415.0" y="745" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">SENT BACK</text>
</svg>
