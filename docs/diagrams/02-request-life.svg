<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" role="img" aria-labelledby="request-life-title request-life-desc">
<title id="request-life-title">Life of one request</title>
<desc id="request-life-desc">A request becomes a ledger row, is dispatched to a topic session, and closes only when the worker shows evidence; missing evidence sends it back.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600&amp;display=swap');</style><marker id="request-life-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="request-life-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="request-life-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="24" y="20" width="912" height="92" rx="8" fill="#2d3142" fill-opacity=".03" stroke="#bfc0c0" stroke-width="1"/><text x="38" y="39" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" font-weight="500" letter-spacing="1.4" fill="#5a6580">YOU</text><text x="70" y="40" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#5a6580">你</text>
<rect x="24" y="116" width="912" height="184" rx="8" fill="#2d3142" fill-opacity=".03" stroke="#bfc0c0" stroke-width="1"/><text x="38" y="135" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" font-weight="500" letter-spacing="1.4" fill="#5a6580">ENTRY SESSION</text><text x="130" y="136" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#5a6580">入口對話</text>
<rect x="24" y="308" width="912" height="288" rx="8" fill="#2d3142" fill-opacity=".03" stroke="#bfc0c0" stroke-width="1"/><text x="38" y="327" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" font-weight="500" letter-spacing="1.4" fill="#5a6580">TOPIC SESSION</text><text x="130" y="328" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#5a6580">主題對話</text>
<rect x="24" y="604" width="912" height="92" rx="8" fill="#2d3142" fill-opacity=".03" stroke="#bfc0c0" stroke-width="1"/><text x="38" y="623" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" font-weight="500" letter-spacing="1.4" fill="#5a6580">YOU</text><text x="70" y="624" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#5a6580">你</text>
<path d="M450,92 L450,128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#request-life-arrow)"/>
<path d="M450,184 L450,220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#request-life-arrow)"/>
