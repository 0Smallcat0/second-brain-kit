<title id="request-life-title">Full: life of one request</title>
<desc id="request-life-desc">A request becomes a tracker item, is handed to a topic session that checks the notes first, and closes only with evidence; the entry and the supervisor open the evidence and send back what does not hold; the user gets the result.</desc>
