<title id="day-timeline-title">Full: a day with reminders</title>
<desc id="day-timeline-desc">A five-minute scheduler tick fires alarm rows into the tracker or an inbox: example morning and deadline rows, the supervisor's evening check, the default Sunday weekly review and a monthly tool re-check; a session starts only when opened or, if chosen, by auto-wake.</desc>
