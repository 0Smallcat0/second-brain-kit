<title id="day-timeline-title">A day with the kit</title>
<desc id="day-timeline-desc">A five-minute scheduler tick fires alarm rows into the ledger or a topic inbox; example rows give a morning list and a reminder, and the default Sunday row starts the weekly review.</desc>
