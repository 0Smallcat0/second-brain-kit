<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 632" width="960" height="632" role="img" aria-labelledby="day-timeline-title day-timeline-desc">
<title id="day-timeline-title">Full: a day with reminders</title>
<desc id="day-timeline-desc">A five-minute check that uses no quota fires alarm rows straight into the running session or starts it within the plan's daily limit: example morning and deadline rows, the daily hand-over check, maintenance's weekly learning loop on Sunday (and Wednesday on Max and higher), and a monthly re-check of outside resources; a woken session checks the second brain (notes and 和 AI 協作 preferences) before it acts; a row missed while the computer was off runs once at the next check.</desc>
