<text x="54" y="555" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">One rule for every outside resource   ·   一條規則</text>
<text x="54" y="576" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" font-weight="400" fill="#4f5d75">By kind of work, the best resource you have that still has quota; task file in, result file out, and open the result.</text>
<text x="54" y="595" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" font-weight="400" fill="#4f5d75">Free tiers never get credentials. Locked or out of quota: next best, and say so. Before a decision, others never see Claude's plan.</text>
