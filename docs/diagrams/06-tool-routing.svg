<title id="tool-routing-title">Full: outside resources</title>
<desc id="tool-routing-desc">No resource has a fixed role: a job is sorted by kind of work, and the user's table channels.md, holding only the outside resources ticked at install (other AI, compute, credits and services), names the best one for that kind now that has quota; with one Claude account each row is still filled inside it; independent review never sees Claude's plan; re-tested monthly.</desc>
