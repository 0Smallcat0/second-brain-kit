<title id="tool-routing-title">Full: which tool gets which job</title>
<desc id="tool-routing-desc">No tool has a fixed role: a job is sorted by kind of work, and the user's own table channels.md names the tool that is best for that kind right now and has quota; the table is filled at install and re-checked monthly or when a new model comes out.</desc>
