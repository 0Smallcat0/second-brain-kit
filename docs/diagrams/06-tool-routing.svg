<rect x="236" y="60" width="688" height="56" rx="6" fill="#f5f5f5"/><rect x="236" y="60" width="688" height="56" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-opacity="1" stroke-width="1.5"/><line x1="456" y1="68" x2="456" y2="108" stroke="#bfc0c0" stroke-width="1"/>
<text x="346.0" y="84.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Claude only</text>
<text x="346.0" y="100.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">只有 Claude（預設）</text>
<text x="690.0" y="77.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Everything stays in Claude</text>
<text x="690.0" y="93.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">入口＋主題對話；長讀、批次檢查交子代理</text>
<text x="690.0" y="107.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">cheap model + low effort for mechanical jobs</text>
<rect x="236" y="132" width="688" height="56" rx="6" fill="#f5f5f5"/><rect x="236" y="132" width="688" height="56" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,3"/><line x1="456" y1="140" x2="456" y2="180" stroke="#bfc0c0" stroke-width="1"/>
<text x="346.0" y="156.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Has ChatGPT / Codex?</text>
<text x="346.0" y="172.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">有 ChatGPT／Codex</text>
<text x="690.0" y="149.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Mechanical batches, script runs, fresh check</text>
<text x="690.0" y="165.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">機械批次、跑腳本等結果、獨立複查</text>
<text x="690.0" y="179.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">codex exec --sandbox read-only …</text>
<rect x="236" y="204" width="688" height="56" rx="6" fill="#f5f5f5"/><rect x="236" y="204" width="688" height="56" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,3"/><line x1="456" y1="212" x2="456" y2="252" stroke="#bfc0c0" stroke-width="1"/>
<text x="346.0" y="228.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Has Gemini / Antigravity?</text>
<text x="346.0" y="244.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">有 Gemini／Antigravity</text>
<text x="690.0" y="221.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Very long reading, first drafts, blind opinion</text>
<text x="690.0" y="237.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">超長閱讀、初稿、盲測第二意見</text>
<text x="690.0" y="251.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">read 'locked until' in channels.md first</text>
<rect x="236" y="276" width="688" height="56" rx="6" fill="#f5f5f5"/><rect x="236" y="276" width="688" height="56" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,3"/><line x1="456" y1="284" x2="456" y2="324" stroke="#bfc0c0" stroke-width="1"/>
<text x="346.0" y="300.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Has Colab / a GPU?</text>
<text x="346.0" y="316.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">有 Colab 或 GPU</text>
<text x="690.0" y="293.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">A second GPU job in parallel</text>
<text x="690.0" y="309.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">多開一個平行的 GPU 工作（不是比較快）</text>
<text x="690.0" y="323.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">checkpoints to Drive from the start</text>
<rect x="236" y="348" width="688" height="56" rx="6" fill="#f5f5f5"/><rect x="236" y="348" width="688" height="56" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,3"/><line x1="456" y1="356" x2="456" y2="396" stroke="#bfc0c0" stroke-width="1"/>
<text x="346.0" y="372.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Has a 2nd Claude account?</text>
<text x="346.0" y="388.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">有第二個 Claude 帳號</text>
<text x="690.0" y="365.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Long background jobs from a brief file</text>
<text x="690.0" y="381.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">長時間背景工作：簡報檔進、結果檔出</text>
<text x="690.0" y="395.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">worker.sh / worker.ps1 · CLAUDE_CONFIG_DIR</text>
<rect x="236" y="420" width="688" height="56" rx="6" fill="#f5f5f5"/><rect x="236" y="420" width="688" height="56" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,3"/><line x1="456" y1="428" x2="456" y2="468" stroke="#bfc0c0" stroke-width="1"/>
<text x="346.0" y="444.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Uses OpenRouter?</text>
<text x="346.0" y="460.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">用 OpenRouter 免費模型</text>
<text x="690.0" y="437.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Mechanical text work, no personal data</text>
<text x="690.0" y="453.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">不含個資的機械文字工作</text>
<text x="690.0" y="467.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">never credentials · free models come and go</text>
<rect x="36" y="520" width="888" height="76" rx="6" fill="#f5f5f5"/><rect x="36" y="520" width="888" height="76" rx="6" fill="#2d3142" fill-opacity=".05" stroke="#4f5d75" stroke-width="1"/>
<text x="54" y="543" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Rules for every extra tool   ·   每個外部工具都照這幾條</text>
<text x="54" y="563" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" font-weight="400" fill="#4f5d75">1  Split by kind of work, never by failure.   2  A job is a brief file in and a result file out; open the result yourself.</text>
<text x="54" y="581" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" font-weight="400" fill="#4f5d75">3  Free tiers and routers never get credentials or private records.   4  Check “locked until” before sending.</text>
<line x1="36" y1="612" x2="924" y2="612" stroke="#bfc0c0" stroke-width="1"/><rect x="40" y="626" width="20" height="12" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-opacity="1" stroke-width="1.5"/><text x="68" y="635" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">DEFAULT</text><rect x="127.80000000000001" y="626" width="20" height="12" rx="3" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,3"/><text x="155.8" y="635" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">ONLY IF YOU HAVE IT</text><rect x="280.4" y="626" width="20" height="12" rx="3" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-opacity="1" stroke-width="1"/><text x="308.4" y="635" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">RULES</text><line x1="357.4" y1="632" x2="383.4" y2="632" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tool-routing-arrow)"/><text x="391.4" y="635" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">BRANCH</text>
