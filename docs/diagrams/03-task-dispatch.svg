<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672" role="img" aria-labelledby="dispatch-title dispatch-desc">
<title id="dispatch-title">Full: who gets the task</title>
<desc id="dispatch-desc">The entry first works out your words (answers at once, edits an earlier item, or splits jobs with a done-when, keeping your words), then routes by routes.md: kit and rule work to maintenance, a job no session owns to a new topic session it opens itself, the rest into the running topic session; multi-topic jobs are chained by the entry and every report comes back to it; heavy work goes to subagents or outside resources by kind of work; a topic session checks the second brain (the notes and the 和 AI 協作 preferences) before it does the job.</desc>
