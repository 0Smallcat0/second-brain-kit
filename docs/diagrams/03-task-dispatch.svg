<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="dispatch-title dispatch-desc">
<title id="dispatch-title">How the entry dispatches a task</title>
<desc id="dispatch-desc">The entry answers quick questions itself, asks the user when no topic fits, otherwise sends the request to the matching topic session; heavy work goes to subagents or an optional second account.</desc>
