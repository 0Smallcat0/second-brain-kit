<title id="architecture-title">Full: how the parts fit together</title>
<desc id="architecture-desc">In the Full plan you talk only to the entry session; it adds tracker items and hands work to topic sessions and the fixed maintenance session, topics close items with evidence, the supervisor opens that evidence and sends back what does not hold, and seven hooks run in every session.</desc>
