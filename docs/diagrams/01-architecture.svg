<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 736" width="960" height="736" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">Full: how the parts fit together</title>
<desc id="architecture-desc">In the Full plan you talk only to the entry session; it works out what you said, writes tracker items and sends each job into the topic session that owns it, starting it if needed; topics check the notes first and report back with evidence; maintenance runs the weekly learning loop over the 和 AI 協作 note and proposes new hooks; seven hooks run in every session.</desc>
