<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 716" width="960" height="716" role="img" aria-labelledby="basic-title basic-desc">
<title id="basic-title">Basic: how it works</title>
<desc id="basic-desc">You talk to one main Claude session started in your notes folder; it checks the notes first, saves notes, keeps the tracker of open work, and safety hooks run around it. The growth loop: when you correct or confirm it, the learn_notice hook reminds Claude to write one line in the 和 AI 協作 note; once a week a light review groups the lines by kind and, after your yes, writes them as preferences that the next task reads first.</desc>
