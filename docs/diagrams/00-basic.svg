<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="basic-title basic-desc">
<title id="basic-title">second-brain-kit Basic: what you get</title>
<desc id="basic-desc">You talk to one main Claude session started in your notes folder; it reads and saves notes and keeps a work list, and safety checks run around it.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600&amp;display=swap');</style><marker id="basic-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="basic-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="basic-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="212" y="36" width="296" height="256" rx="8" fill="#2d3142" fill-opacity=".03" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4"/><text x="226" y="55" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" font-weight="500" letter-spacing="1.4" fill="#5a6580">SAFETY CHECKS</text><text x="318" y="56" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#5a6580">安全檢查</text>
<path d="M156,124 L236,124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#basic-arrow)"/>
<path d="M484,92 L628,92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#basic-arrow)"/>
<path d="M484,180 L628,180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#basic-arrow)"/>
<rect x="183.1" y="102.0" width="25.9" height="14" rx="2" fill="#f5f5f5"/><text x="196.0" y="111.8" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.5" fill="#5a6580">ASK</text>
<rect x="521.9" y="70.0" width="68.3" height="14" rx="2" fill="#f5f5f5"/><text x="556.0" y="79.8" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.5" fill="#5a6580">READ · SAVE</text>
<rect x="521.9" y="158.0" width="68.3" height="14" rx="2" fill="#f5f5f5"/><text x="556.0" y="167.8" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.5" fill="#5a6580">ADD · CLOSE</text>
<rect x="36" y="92" width="120" height="64" rx="6" fill="#f5f5f5"/><rect x="36" y="92" width="120" height="64" rx="6" fill="#4f5d75" fill-opacity="0.1" stroke="#5a6580" stroke-opacity="1" stroke-width="1"/><text x="96.0" y="120.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">You</text><text x="96.0" y="136.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">你：只要說話</text>
<rect x="236" y="76" width="248" height="120" rx="6" fill="#f5f5f5"/><rect x="236" y="76" width="248" height="120" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-opacity="1" stroke-width="1.5"/><text x="360.0" y="125.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Main Claude session</text><text x="360.0" y="141.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">主對話：在筆記資料夾裡開</text><text x="360.0" y="155.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">desktop launcher, or claude</text>
<rect x="628" y="56" width="216" height="72" rx="6" fill="#f5f5f5"/><rect x="628" y="56" width="216" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-opacity="1" stroke-width="1"/><text x="736.0" y="81.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Notes folder</text><text x="736.0" y="97.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">筆記資料夾</text><text x="736.0" y="111.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">numbered notes · index</text>
<rect x="628" y="144" width="216" height="72" rx="6" fill="#f5f5f5"/><rect x="628" y="144" width="216" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-opacity="1" stroke-width="1"/><text x="736.0" y="169.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Work list</text><text x="736.0" y="185.8" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">工作清單：還沒做完的事</text><text x="736.0" y="199.2" text-anchor="middle" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5a6580">Claude adds and closes</text>
<rect x="628" y="236" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="628" y="236" width="216" height="56" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,3"/><text x="736.0" y="260.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">More, when you want it</text><text x="736.0" y="276.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4f5d75">進階功能：之後再開</text>
<text x="236" y="224" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" font-weight="400" fill="#4f5d75">asks before upload, delete  ·  先問再上傳、刪除</text>
<text x="236" y="242" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" font-weight="400" fill="#4f5d75">reads a note to the end  ·  筆記讀到最後</text>
<text x="236" y="260" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" font-weight="400" fill="#4f5d75">puts your words back  ·  放回你的原話</text>
<text x="236" y="278" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" font-weight="400" fill="#4f5d75">logs an unchecked done  ·  記下沒查證的做完</text>
<text x="36" y="192" text-anchor="start" font-family="'Instrument Serif','Noto Serif TC','Georgia',serif" font-size="14" font-weight="400" fill="#4f5d75" font-style="italic">You never type commands:</text>
<text x="36" y="210" text-anchor="start" font-family="'Instrument Serif','Noto Serif TC','Georgia',serif" font-size="14" font-weight="400" fill="#4f5d75" font-style="italic">Claude keeps the list.</text>
<text x="36" y="232" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6580">指令由 Claude 打，</text>
<text x="36" y="250" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6580">清單也由它記。</text>
<line x1="36" y1="334" x2="924" y2="334" stroke="#bfc0c0" stroke-width="1"/><rect x="40" y="348" width="20" height="12" rx="3" fill="#4f5d75" fill-opacity="0.1" stroke="#5a6580" stroke-opacity="1" stroke-width="1"/><text x="68" y="357" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">YOU</text><rect x="106.2" y="348" width="20" height="12" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-opacity="1" stroke-width="1.5"/><text x="134.2" y="357" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">THE ONE SESSION</text><rect x="237.2" y="348" width="20" height="12" rx="3" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-opacity="1" stroke-width="1"/><text x="265.2" y="357" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">YOUR DATA</text><rect x="335.79999999999995" y="348" width="20" height="12" rx="3" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,3"/><text x="363.79999999999995" y="357" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">LATER, OPTIONAL</text><line x1="466.79999999999995" y1="354" x2="492.79999999999995" y2="354" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#basic-arrow)"/><text x="500.79999999999995" y="357" font-family="'Geist Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="8" letter-spacing="0.6" fill="#5a6580">READS / WRITES</text>
</svg>
