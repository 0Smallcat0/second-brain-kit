<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-labelledby="dzh-t dzh-d">
<title id="dzh-t">它怎麼學</title>
<desc id="dzh-d">你糾正 Claude 或說它做對了；Claude 記一行（日期、你的原話、哪一類）；每週整理一次；你說好之後變成偏好；下個對話照著做，之後每次糾正都再教它一點。</desc>
<defs><marker id="dzh-ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#2d3142"/></marker><marker id="dzh-aha" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#bf4520"/></marker></defs>
<rect x="1.5" y="1.5" width="877" height="233" rx="14" fill="#f5f5f5" stroke="#7d8496" stroke-width="3"/>
<rect x="24" y="36" width="144" height="132" rx="12" fill="#e4e6ea" stroke="#2d3142" stroke-width="1.5"/>
<circle cx="44" cy="36" r="14" fill="#bf4520"/>
<text x="44" y="42" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#ffffff">1</text>
<text x="96.0" y="90.0" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#2d3142" data-max="130">你糾正它，</text>
<text x="96.0" y="112.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="400" fill="#4f5d75" data-max="130">或說</text>
<text x="96.0" y="134.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="400" fill="#4f5d75" data-max="130">「做對了」</text>
<path d="M170,102 L194,102" fill="none" stroke="#bf4520" stroke-width="3" marker-end="url(#dzh-aha)"/>
<rect x="196" y="36" width="144" height="132" rx="12" fill="#f3e4df" stroke="#bf4520" stroke-width="2"/>
<circle cx="216" cy="36" r="14" fill="#bf4520"/>
<text x="216" y="42" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#ffffff">2</text>
<text x="268.0" y="90.0" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#2d3142" data-max="130">Claude 記一行：</text>
<text x="268.0" y="112.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="400" fill="#4f5d75" data-max="130">日期、原話、</text>
<text x="268.0" y="134.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="400" fill="#4f5d75" data-max="130">哪一類</text>
<path d="M342,102 L366,102" fill="none" stroke="#bf4520" stroke-width="3" marker-end="url(#dzh-aha)"/>
<rect x="368" y="36" width="144" height="132" rx="12" fill="#e4e6ea" stroke="#2d3142" stroke-width="1.5"/>
<circle cx="388" cy="36" r="14" fill="#bf4520"/>
<text x="388" y="42" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#ffffff">3</text>
<text x="440.0" y="90.0" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#2d3142" data-max="130">每週一次</text>
<text x="440.0" y="112.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="400" fill="#4f5d75" data-max="130">把同類的</text>
<text x="440.0" y="134.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="400" fill="#4f5d75" data-max="130">歸在一起</text>
<path d="M514,102 L538,102" fill="none" stroke="#bf4520" stroke-width="3" marker-end="url(#dzh-aha)"/>
<rect x="540" y="36" width="144" height="132" rx="12" fill="#f3e4df" stroke="#bf4520" stroke-width="2"/>
<circle cx="560" cy="36" r="14" fill="#bf4520"/>
<text x="560" y="42" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#ffffff">4</text>
<text x="612.0" y="90.0" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#2d3142" data-max="130">你說好，</text>
<text x="612.0" y="112.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="400" fill="#4f5d75" data-max="130">它才變成</text>
<text x="612.0" y="134.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="400" fill="#4f5d75" data-max="130">偏好</text>
<path d="M686,102 L710,102" fill="none" stroke="#bf4520" stroke-width="3" marker-end="url(#dzh-aha)"/>
<rect x="712" y="36" width="144" height="132" rx="12" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
<circle cx="732" cy="36" r="14" fill="#bf4520"/>
<text x="732" y="42" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#ffffff">5</text>
<text x="784.0" y="90.0" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#2d3142" data-max="130">下個對話</text>
<text x="784.0" y="112.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="400" fill="#4f5d75" data-max="130">一開始就</text>
<text x="784.0" y="134.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="400" fill="#4f5d75" data-max="130">照著做</text>
<path d="M784.0,168 L784.0,200 L96.0,200 L96.0,170" fill="none" stroke="#bf4520" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#dzh-aha)"/>
<rect x="341.44" y="187" width="225.12" height="26" rx="4" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0"/>
<text x="454" y="206" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="600" fill="#bf4520" data-max="205.12">每次糾正，都再教它一點</text>
</svg>
