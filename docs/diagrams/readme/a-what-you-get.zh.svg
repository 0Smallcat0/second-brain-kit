<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-labelledby="azh-t azh-d">
<title id="azh-t">裝好之後你得到什麼</title>
<desc id="azh-d">你只跟一個在筆記資料夾裡開的 Claude 對話說話。安全檢查在旁邊看著。它有換新對話也找得回來的筆記資料夾、記著還沒做完的事的追蹤表，以及記你糾正過什麼、會從中學習的筆記。</desc>
<defs><marker id="azh-ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#2d3142"/></marker><marker id="azh-aha" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#bf4520"/></marker></defs>
<rect x="1.5" y="1.5" width="877" height="349" rx="14" fill="#f5f5f5" stroke="#7d8496" stroke-width="3"/>
<rect x="24" y="134" width="140" height="92" rx="10" fill="#e4e6ea" stroke="#2d3142" stroke-width="1.5"/>
<text x="94" y="176.5" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" font-weight="700" fill="#2d3142" data-max="124">你</text>
<text x="94" y="199.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="124">只要說話</text>
<rect x="214" y="24" width="296" height="304" rx="12" fill="#efefef" stroke="#7d8496" stroke-width="1.5" stroke-dasharray="7,5"/>
<text x="362" y="50" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="600" fill="#bf4520" data-max="270">外面一圈是安全檢查</text>
<rect x="238" y="66" width="248" height="140" rx="10" fill="#f3e4df" stroke="#bf4520" stroke-width="2"/>
<text x="362" y="122.7" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="22" font-weight="700" fill="#2d3142" data-max="228">Claude</text>
<text x="362" y="146.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="228">在你的筆記資料夾</text>
<text x="362" y="167.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="228">裡開的一個對話</text>
<path d="M238,228 l6,7 l11,-14" fill="none" stroke="#bf4520" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="264" y="234" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#2d3142" data-max="236">有風險的事先問你</text>
<path d="M238,258 l6,7 l11,-14" fill="none" stroke="#bf4520" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="264" y="264" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#2d3142" data-max="236">提醒它先看結果再說做完</text>
<path d="M238,288 l6,7 l11,-14" fill="none" stroke="#bf4520" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="264" y="294" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#2d3142" data-max="236">聊很久也留著你的原話</text>
<path d="M164,180 L238,180" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#azh-ah)"/>
<rect x="570" y="24" width="286" height="92" rx="10" fill="#e4e6ea" stroke="#2d3142" stroke-width="1.5"/>
<text x="713" y="55.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="18" font-weight="700" fill="#2d3142" data-max="266">筆記資料夾</text>
<text x="713" y="77.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="266">換了新對話</text>
<text x="713" y="98.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="266">也找得回來</text>
<rect x="570" y="130" width="286" height="92" rx="10" fill="#e4e6ea" stroke="#2d3142" stroke-width="1.5"/>
<text x="713" y="161.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="18" font-weight="700" fill="#2d3142" data-max="266">追蹤表</text>
<text x="713" y="183.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="266">還沒做完的事，</text>
<text x="713" y="204.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="266">附上確認才關掉</text>
<rect x="570" y="236" width="286" height="92" rx="10" fill="#f3e4df" stroke="#bf4520" stroke-width="2"/>
<text x="713" y="267.3" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="18" font-weight="700" fill="#2d3142" data-max="266">從你身上學</text>
<text x="713" y="289.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="266">每次糾正記一行，</text>
<text x="713" y="310.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="266">你說好才變成偏好</text>
<path d="M486,100 L528,100 L528,70 L570,70" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#azh-ah)"/>
<path d="M486,176 L570,176" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#azh-ah)"/>
<path d="M486,196 L528,196 L528,282 L570,282" fill="none" stroke="#bf4520" stroke-width="2" marker-end="url(#azh-aha)"/>
</svg>
