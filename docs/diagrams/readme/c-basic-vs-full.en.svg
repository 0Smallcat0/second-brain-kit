<rect x="672" y="222" width="168" height="34" rx="17" fill="#ffffff" stroke="#5a6580" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="756.0" y="245" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#2d3142" data-max="154">Outside resources</text>
<text x="626" y="284.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="440">For several subjects and deadlines you forget</text>
