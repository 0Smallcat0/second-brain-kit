<text x="838" y="51" text-anchor="end" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#ffffff" data-max="300">switched on later, one part at a time</text>
