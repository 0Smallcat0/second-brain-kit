<rect x="512" y="103" width="98" height="80" rx="10" fill="#f3e4df" stroke="#bf4520" stroke-width="2"/>
<text x="561" y="148.9" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#2d3142" data-max="86">入口</text>
<path d="M482,143 L512,143" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#czh-ah)"/>
<rect x="668" y="78" width="168" height="38" rx="8" fill="#e4e6ea" stroke="#2d3142" stroke-width="1.5"/>
<text x="752" y="103" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" data-max="150">主題 A</text>
<path d="M610,143 L639,143 L639,97 L668,97" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#czh-ah)"/>
<rect x="668" y="124" width="168" height="38" rx="8" fill="#e4e6ea" stroke="#2d3142" stroke-width="1.5"/>
<text x="752" y="149" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" data-max="150">主題 B</text>
<path d="M610,143 L668,143" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#czh-ah)"/>
<rect x="668" y="170" width="168" height="38" rx="8" fill="#e4e6ea" stroke="#2d3142" stroke-width="1.5"/>
<text x="752" y="195" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" data-max="150">主題 C</text>
<path d="M610,143 L639,143 L639,189 L668,189" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#czh-ah)"/>
<rect x="412" y="222" width="132" height="34" rx="17" fill="#ffffff" stroke="#5a6580" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="478.0" y="245" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#2d3142" data-max="118">系統維護</text>
<rect x="556" y="222" width="104" height="34" rx="17" fill="#ffffff" stroke="#5a6580" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="608.0" y="245" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#2d3142" data-max="90">提醒</text>
<rect x="672" y="222" width="168" height="34" rx="17" fill="#ffffff" stroke="#5a6580" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="756.0" y="245" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#2d3142" data-max="154">外部資源</text>
<text x="626" y="284.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="440">適合好幾件事、常忘記期限</text>
</svg>
