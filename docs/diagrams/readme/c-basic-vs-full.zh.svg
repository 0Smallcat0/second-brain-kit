<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322" width="880" height="322" role="img" aria-labelledby="czh-t czh-d">
<title id="czh-t">基本款和完整款</title>
<desc id="czh-d">基本款：你只跟一個對話說話，它管筆記和追蹤表。完整款：你跟入口對話說話，入口把每件事送進各自主題的對話，另有系統維護對話和提醒。基本款一定裝，完整款每一項各自開。</desc>
<defs><marker id="czh-ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#2d3142"/></marker><marker id="czh-aha" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#bf4520"/></marker></defs>
<rect x="1.5" y="1.5" width="877" height="319" rx="14" fill="#f5f5f5" stroke="#7d8496" stroke-width="3"/>
<rect x="24" y="24" width="340" height="274" rx="14" fill="#ffffff" stroke="#bf4520" stroke-width="2.5"/>
<path d="M24,38 a14,14 0 0 1 14,-14 H350 a14,14 0 0 1 14,14 V64 H24 Z" fill="#bf4520"/>
<text x="44" y="52" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="22" font-weight="700" fill="#ffffff" data-max="120">基本款</text>
<text x="344" y="51" text-anchor="end" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#ffffff" data-max="170">一定會裝</text>
<rect x="40" y="93" width="86" height="100" rx="10" fill="#e4e6ea" stroke="#2d3142" stroke-width="1.5"/>
<text x="83.0" y="148.9" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#2d3142" data-max="74">你</text>
<rect x="148" y="93" width="86" height="100" rx="10" fill="#f3e4df" stroke="#bf4520" stroke-width="2"/>
<text x="191.0" y="137.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="700" fill="#2d3142" data-max="74">一個</text>
<text x="191.0" y="159.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="700" fill="#2d3142" data-max="74">對話</text>
<rect x="256" y="93" width="86" height="100" rx="10" fill="#e4e6ea" stroke="#2d3142" stroke-width="1.5"/>
<text x="299.0" y="137.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="700" fill="#2d3142" data-max="74">筆記＋</text>
<text x="299.0" y="159.6" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="700" fill="#2d3142" data-max="74">追蹤表</text>
<path d="M126,143 L148,143" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#czh-ah)"/>
<path d="M234,143 L256,143" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#czh-ah)"/>
<text x="194" y="277.2" text-anchor="middle" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#4f5d75" data-max="316">適合剛開始、一次幾件事</text>
<rect x="396" y="24" width="460" height="274" rx="14" fill="#ffffff" stroke="#2d3142" stroke-width="2" stroke-dasharray="8,5"/>
<path d="M396,38 a14,14 0 0 1 14,-14 H842 a14,14 0 0 1 14,14 V64 H396 Z" fill="#2d3142"/>
<text x="416" y="52" text-anchor="start" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="22" font-weight="700" fill="#ffffff" data-max="100">完整款</text>
<text x="838" y="51" text-anchor="end" font-family="'Geist','Segoe UI','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" font-weight="400" fill="#ffffff" data-max="300">之後想要再開，一項一項開</text>
<rect x="412" y="111" width="70" height="64" rx="10" fill="#e4e6ea" stroke="#2d3142" stroke-width="1.5"/>
